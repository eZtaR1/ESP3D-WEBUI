# pl0tb0t FluidNC config
# PRE-COMMIT CHECKLIST (do before $CD=config.yaml):
#   1. Verify Y homing with debug on (read feed-phase SG_Val, confirm trip margin)
#   2. Pen heights are Z positions now: tune them in the WebUI Pen tab (live, no restart)
#   3. Set x AND y stallguard_debug: false
#   4. $CD=config.yaml  then back up the file
# X tuned: seek 2000 / feed 500 / stallguard 24. Confirm repeatable across reboot before trusting.

board: MKS-DLC32
name: pl0tb0t
meta: 2026-06-27 by mkl
stepping:
  engine: I2S_STATIC
  idle_ms: 255
  pulse_us: 4
  dir_delay_us: 1
  disable_delay_us: 0
  segments: 12

uart1:
  txd_pin: gpio.0
  rxd_pin: gpio.4
  rts_pin: NO_PIN
  cts_pin: NO_PIN
  baud: 115200
  mode: 8N1
  passthrough_baud: 0
  passthrough_mode: 8E1

i2so:
  bck_pin: gpio.16
  data_pin: gpio.21
  ws_pin: gpio.17
  min_pulse_us: 2

spi:
  miso_pin: gpio.12
  mosi_pin: gpio.13
  sck_pin: gpio.14

sdcard:
  cs_pin: gpio.15
  card_detect_pin: gpio.39
  frequency_hz: 8000000

kinematics:
  Cartesian:

axes:
  shared_stepper_disable_pin: I2SO.0
  shared_stepper_reset_pin: NO_PIN
  homing_runs: 2
  x:
    steps_per_mm: 80.000000
    max_rate_mm_per_min: 5000.000000
    acceleration_mm_per_sec2: 500.000000
    max_travel_mm: 400.000000
    soft_limits: true
    homing:
      cycle: 1
      allow_single_axis: true
      positive_direction: false
      mpos_mm: 0.000000
      feed_mm_per_min: 500.000000
      seek_mm_per_min: 2000.000000
      settle_ms: 250
      seek_scaler: 1.100000
      feed_scaler: 1.100000

    motor0:
      limit_neg_pin: gpio.36
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 5.000000
      tmc_2209:
        addr: 0
        cs_pin: NO_PIN
        uart_num: 1
        step_pin: I2SO.1
        direction_pin: I2SO.2
        disable_pin: NO_PIN
        r_sense_ohms: 0.110000
        run_amps: 1.000000
        hold_amps: 0.300000
        microsteps: 16
        toff_disable: 0
        toff_stealthchop: 5
        use_enable: true
        run_mode: StealthChop
        homing_mode: StallGuard
        homing_amps: 0.300000
        stallguard: 24
        stallguard_debug: false
        toff_coolstep: 3

  y:
    steps_per_mm: 80.000000
    max_rate_mm_per_min: 5000.000000
    acceleration_mm_per_sec2: 1000.000000
    max_travel_mm: 365.000000
    soft_limits: true
    homing:
      cycle: 2
      allow_single_axis: true
      positive_direction: false
      mpos_mm: 0.000000
      feed_mm_per_min: 500.000000
      seek_mm_per_min: 2000.000000
      settle_ms: 250
      seek_scaler: 1.100000
      feed_scaler: 1.100000

    motor0:
      limit_neg_pin: gpio.35
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 5.000000
      tmc_2209:
        addr: 1
        cs_pin: NO_PIN
        uart_num: 1
        step_pin: I2SO.5
        direction_pin: I2SO.6
        disable_pin: NO_PIN
        r_sense_ohms: 0.110000
        run_amps: 1.000000
        hold_amps: 0.600000
        microsteps: 16
        toff_disable: 0
        toff_stealthchop: 5
        use_enable: true
        run_mode: StealthChop
        homing_mode: StallGuard
        homing_amps: 0.300000
        stallguard: 30
        stallguard_debug: false
        toff_coolstep: 3

  z:
    # Pen lift: RC servo on the Z axis. Z0 = top (max_pulse_us), Z-8 = bottom
    # (min_pulse_us), 100 us per mm. Pen up Z0 = 2100 us, pen down Z-7 = 1400 us
    # (the old BESC up/down). Use G53 G0 Z... so work offsets never shift the pen.
    steps_per_mm: 100.000000
    max_rate_mm_per_min: 2400.000000
    acceleration_mm_per_sec2: 1000.000000
    max_travel_mm: 8.000000
    soft_limits: true
    motor0:
      rc_servo:
        output_pin: gpio.22
        pwm_hz: 50
        min_pulse_us: 1300
        max_pulse_us: 2100

control:
  safety_door_pin: NO_PIN
  reset_pin: NO_PIN
  feed_hold_pin: NO_PIN
  cycle_start_pin: NO_PIN
  macro0_pin: NO_PIN
  macro1_pin: NO_PIN
  macro2_pin: NO_PIN
  macro3_pin: NO_PIN
  fault_pin: NO_PIN
  estop_pin: NO_PIN
  homing_button_pin: NO_PIN

coolant:
  flood_pin: NO_PIN
  mist_pin: NO_PIN
  delay_ms: 0

probe:
  pin: NO_PIN
  toolsetter_pin: NO_PIN
  check_mode_start: true
  hard_stop: false

macros:
  startup_line0:
  startup_line1:
  Macro0: $G
  Macro1: $G
  Macro2: $G
  Macro3: $G
  after_homing: G53 G0 Z0 & G0 X398 Y362
  after_reset:
  after_unlock:

start:
  must_home: false
  deactivate_parking: false
  check_limits: true

parking:
  enable: false
  axis: Z
  target_mpos_mm: -5.000000
  rate_mm_per_min: 800.000000
  pullout_distance_mm: 5.000000
  pullout_rate_mm_per_min: 250.000000

user_outputs:
  analog0_pin: NO_PIN
  analog1_pin: NO_PIN
  analog2_pin: NO_PIN
  analog3_pin: NO_PIN
  analog0_hz: 5000
  analog1_hz: 5000
  analog2_hz: 5000
  analog3_hz: 5000
  digital0_pin: NO_PIN
  digital1_pin: NO_PIN
  digital2_pin: NO_PIN
  digital3_pin: NO_PIN
  digital4_pin: NO_PIN
  digital5_pin: NO_PIN
  digital6_pin: NO_PIN
  digital7_pin: NO_PIN

user_inputs:
  analog0_pin: NO_PIN
  analog1_pin: NO_PIN
  analog2_pin: NO_PIN
  analog3_pin: NO_PIN
  digital0_pin: NO_PIN
  digital1_pin: NO_PIN
  digital2_pin: NO_PIN
  digital3_pin: NO_PIN
  digital4_pin: NO_PIN
  digital5_pin: NO_PIN
  digital6_pin: NO_PIN
  digital7_pin: NO_PIN

arc_tolerance_mm: 0.002000
junction_deviation_mm: 0.010000
verbose_errors: true
report_inches: false
enable_parking_override_control: false
use_line_numbers: false
planner_blocks: 32
